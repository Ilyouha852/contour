kind = "api"
previewPath = "/api"
title = "API сервиса подбора контрагентов"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uv run --project ../.. uvicorn app.main:app --host 0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["uv", "sync", "--project", "."]

[services.production.run]
args = ["sh", "-c", "cd artifacts/api-server && uv run --project ../.. uvicorn app.main:app --host 0.0.0.0 --port \"$PORT\""]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"